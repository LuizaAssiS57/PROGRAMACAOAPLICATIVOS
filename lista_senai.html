<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA SENAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="toggleTheme" class="theme-toggle">🌓</button>

    <main class="container">
        <img src="assets/logos_senai_branco.png" alt="Logo SENAI" class="logo">

        <h3>Lista Aprovados SENAI</h3>

        <div class="input-group">
            <input type="text" id="novoAprovado" placeholder="Digite o nome do aprovado...">
            <button id="btnAdicionar" class="btn-add">ADICIONAR</button>
        </div>

        <ul id="listaAprovados">
            </ul>

        <div class="footer-actions">
            <button id="btnLimpar" class="btn-secondary">LIMPAR TUDO</button>
            <a href="index.html" class="btn-link-back">VOLTAR</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
