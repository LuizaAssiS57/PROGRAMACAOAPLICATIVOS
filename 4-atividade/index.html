<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 - ATIVIDADE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="src/spiderman-heart-logo-png_seeklogo-424877.png" alt="Logotipo do Homem Aranha">
        <h2>EXERCÍCIO</h2>
        <p>Crie um site para informar se uma pessoa é obrigada a votar. 
           Considere que a regra é: 
               - menores de 16, não podem votar 
               - entre 16 e 17 anos, voto opcional 
               - a partir de 18, voto obrigatório 
               - maiores que 65 não são obrigados a votar. 

        Deve ter logotipo.</p>

        <div class="input-group">
            <input type="number" id="idadeUsuario" placeholder="Sua idade">
        </div>

        <button id="btnVerificar">Verificar Voto 🕷️</button>

        <div id="resultado"></div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
