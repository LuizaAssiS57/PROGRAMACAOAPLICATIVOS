<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>3 - ATIVIDADE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="src/HappyLemon-v1.9-fit.png" alt="Limão fofo">
        <h2>EXERCÍCIO</h2>
        <p>Crie um site para solicitar ao usuário três notas para o usuário. Calcule a média do aluno. Caso a média do aluno seja menor que 7, o aluno está reprovado. Mostrar: média e se está aprovado ou reprovado. Deve ter logotipo.</p>

        <div class="input-group">
            <input type="number" id="nota1" placeholder="Nota 1">
            <input type="number" id="nota2" placeholder="Nota 2">
            <input type="number" id="nota3" placeholder="Nota 3">
        </div>

        <button id="btnCalcular">Calcular Média 🍋</button>

        <div id="resultado"></div>
    </div>
    
    <script src="script.js"></script>
</body>
